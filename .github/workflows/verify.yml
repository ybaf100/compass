name: verify compass
on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - name: Verify repeat bootstrap and permanent app ID
        run: |
          bash tool/bootstrap.sh
          python3 tool/verify_app_identity.py
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        env:
          KAKAO_NATIVE_APP_KEY: ${{ vars.KAKAO_NATIVE_APP_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build apk --debug \
            --dart-define="KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define="MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: compass-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: python3 tool/verify_app_identity.py
      - name: Build iOS simulator app
        env:
          KAKAO_NATIVE_APP_KEY: ${{ vars.KAKAO_NATIVE_APP_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build ios --simulator --debug \
            --dart-define="KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define="MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}"
      - name: Package iOS simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/compass-ios-simulator.zip
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: compass-ios-simulator
          path: build/ios/compass-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  ios-sideload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: python3 tool/verify_app_identity.py
      - name: Build unsigned iOS device app
        env:
          KAKAO_NATIVE_APP_KEY: ${{ vars.KAKAO_NATIVE_APP_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define="KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define="MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}"
      - name: Package and verify sideload IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          app=build/ios/ipa/Payload/Runner.app
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Compass' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName Compass' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.ybaf100.compass
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          lipo -archs "$app/Runner" | grep -qw arm64
          (cd build/ios/ipa && ditto -c -k --sequesterRsrc --keepParent Payload compass-ios-sideload-unsigned.ipa)
          unzip -tq build/ios/ipa/compass-ios-sideload-unsigned.ipa
      - name: Upload sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: compass-ios-sideload-unsigned
          path: build/ios/ipa/compass-ios-sideload-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
