name: verify passcom
on:
  push:
    branches: [main, 'feature/**']
  pull_request:

# Push and PR events for the same source branch share a group. Other branches
# and forks retain their own runs; only superseded builds are cancelled.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - name: Verify repeat bootstrap, passcom branding and permanent app ID
        run: |
          bash tool/bootstrap.sh
          python3 tool/verify_app_identity.py
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        env:
          KAKAO_NATIVE_APP_KEY: ${{ vars.KAKAO_NATIVE_APP_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build apk --debug \
            --dart-define="KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define="MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}"
      - name: Verify compiled APK name and package
        run: python3 tool/verify_app_identity.py --apk build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: passcom-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: python3 tool/verify_app_identity.py
      - run: xcodebuild -version
      - name: Build iOS simulator app
        env:
          KAKAO_NATIVE_APP_KEY: ${{ vars.KAKAO_NATIVE_APP_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build ios --simulator --debug \
            --dart-define="KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define="MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}"
      - name: Verify and package iOS simulator app
        run: |
          python3 tool/verify_app_identity.py --ios-app build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/passcom-ios-simulator.zip
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: passcom-ios-simulator
          path: build/ios/passcom-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Run iPad simulator native plugin lifecycle smoke test
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPad" in d["name"]]; print(devices[0]["udid"])')
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          flutter test integration_test/plugin_registration_test.dart -d "$simulator_id"

  ios-sideload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - run: python3 tool/verify_app_identity.py
      - name: Build unsigned iOS device app
        env:
          KAKAO_NATIVE_APP_KEY: ${{ vars.KAKAO_NATIVE_APP_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define="KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}" \
            --dart-define="SUPABASE_URL=${SUPABASE_URL}" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}" \
            --dart-define="MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}"
      - name: Package and verify sideload IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          app=build/ios/ipa/Payload/Runner.app
          python3 tool/verify_app_identity.py --ios-app "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          lipo -archs "$app/Runner" | grep -qw arm64
          (cd build/ios/ipa && ditto -c -k --sequesterRsrc --keepParent Payload passcom-ios-sideload-unsigned.ipa)
          unzip -tq build/ios/ipa/passcom-ios-sideload-unsigned.ipa
          python3 tool/verify_app_identity.py --ipa build/ios/ipa/passcom-ios-sideload-unsigned.ipa
      - name: Upload sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: passcom-ios-sideload-unsigned
          path: build/ios/ipa/passcom-ios-sideload-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
